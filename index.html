<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma perguntinha ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    145deg,
                    #ffdce8,
                    #f7c7d8,
                    #ead7ff
                );

            overflow: hidden;
            color: #4a2635;
        }

        /* Corações flutuando */

        .coracao {
            position: fixed;
            bottom: -40px;
            font-size: 24px;
            opacity: 0.35;
            pointer-events: none;

            animation:
                subir 7s linear infinite;
        }

        .c1 {
            left: 8%;
            animation-delay: 0s;
        }

        .c2 {
            left: 25%;
            animation-delay: 2s;
        }

        .c3 {
            left: 70%;
            animation-delay: 1s;
        }

        .c4 {
            left: 88%;
            animation-delay: 3s;
        }

        @keyframes subir {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            100% {
                transform:
                    translateY(-115vh)
                    rotate(360deg);
            }
        }

        /* Cartão */

        .card {
            width: 100%;
            max-width: 390px;

            padding: 35px 25px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.90);

            border-radius: 28px;

            box-shadow:
                0 18px 50px
                rgba(100, 50, 80, 0.20);

            backdrop-filter: blur(10px);

            animation:
                aparecer 0.8s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.95);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* Coração principal */

        .emoji {
            font-size: 58px;
            margin-bottom: 12px;

            animation:
                bater 1.5s infinite;
        }

        @keyframes bater {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        h1 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .pergunta {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Botões */

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 18px;

            font-family: inherit;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: translateY(-2px);
        }

        .sim {
            background: #ff6f9c;
            color: white;

            box-shadow:
                0 7px 18px
                rgba(255, 111, 156, 0.30);
        }

        .talvez {
            background: #eadbff;
            color: #68427d;
        }

        .nao {
            background: #f1eeee;
            color: #6b5c61;
        }

        /* Resposta */

        #resposta {
            display: none;

            margin-top: 25px;

            padding: 20px;

            border-radius: 20px;

            background: #fff0f5;

            font-size: 17px;
            line-height: 1.5;

            animation:
                aparecer 0.5s ease;
        }

        .voltar {
            display: none;

            margin-top: 15px;

            background: transparent;

            color: #9b6478;

            font-size: 14px;
        }

        /* Pequena assinatura */

        .assinatura {
            margin-top: 22px;

            font-size: 12px;

            color: #9b7885;
        }
    </style>
</head>

<body>

    <!-- Corações -->

    <div class="coracao c1">❤️</div>
    <div class="coracao c2">💗</div>
    <div class="coracao c3">💕</div>
    <div class="coracao c4">💖</div>


    <main class="card">

        <!-- Coração principal -->

        <div class="emoji">
            🥹❤️
        </div>


        <!-- Título -->

        <h1>
            Uma perguntinha hipotética...
        </h1>


        <!-- Pergunta -->

        <p class="pergunta">

            Se eu estivesse aí agora,
            bem do seu ladinho,
            e te pedisse em namoro...

            <br><br>

            o que você me responderia? 👀❤️

        </p>


        <!-- Botões -->

        <div
            class="botoes"
            id="botoes"
        >

            <button
                class="sim"
                onclick="responder('sim')"
            >
                Sim ❤️
            </button>


            <button
                class="talvez"
                onclick="responder('talvez')"
            >
                Talvez... 👀
            </button>


            <button
                class="nao"
                onclick="responder('nao')"
            >
                Não 😭
            </button>

        </div>


        <!-- Resposta -->

        <div id="resposta"></div>


        <!-- Voltar -->

        <button
            class="voltar"
            id="voltar"
            onclick="voltar()"
        >
            ← Quero escolher de novo
        </button>


        <div class="assinatura">
            Feito com carinho ❤️
        </div>

    </main>


    <script>

        /*
        ==========================================
        CONFIGURAÇÃO DO WHATSAPP
        ==========================================
        */

        const meuWhatsApp = "5565996921583";


        /*
        ==========================================
        FUNÇÃO DOS BOTÕES
        ==========================================
        */

        function responder(opcao) {

            let mensagem = "";


            /*
            SIM
            */

            if (opcao === "sim") {

                mensagem =
`Vitória respondeu: SIM ❤️🥹`;

            }


            /*
            TALVEZ
            */

            if (opcao === "talvez") {

                mensagem =
`Vitória respondeu: TALVEZ 👀❤️`;

            }


            /*
            NÃO
            */

            if (opcao === "nao") {

                mensagem =
`Vitória respondeu: NÃO 😭`;

            }


            /*
            Abre o WhatsApp
            */

            const link =
                `https://wa.me/${meuWhatsApp}?text=${
                    encodeURIComponent(mensagem)
                }`;


            window.location.href = link;

        }


        /*
        ==========================================
        BOTÃO VOLTAR
        ==========================================
        */

        function voltar() {

            document.getElementById("botoes")
                .style.display = "flex";

            document.getElementById("resposta")
                .style.display = "none";

            document.getElementById("voltar")
                .style.display = "none";

        }


        /*
        ==========================================
        CONFETES DE CORAÇÃO
        ==========================================
        */

        function confetes() {

            for (let i = 0; i < 30; i++) {

                const coracao =
                    document.createElement("div");


                coracao.innerHTML =
                    ["❤️", "💕", "💖", "💗", "🥹"]
                    [
                        Math.floor(
                            Math.random() * 5
                        )
                    ];


                coracao.style.position =
                    "fixed";

                coracao.style.left =
                    Math.random() * 100 + "vw";

                coracao.style.top =
                    "-30px";

                coracao.style.fontSize =
                    (15 + Math.random() * 20) + "px";

                coracao.style.zIndex =
                    "9999";

                coracao.style.pointerEvents =
                    "none";


                document.body.appendChild(
                    coracao
                );


                const duracao =
                    2000 +
                    Math.random() * 2000;


                coracao.animate(

                    [
                        {
                            transform:
                                "translateY(0) rotate(0deg)",

                            opacity: 1
                        },

                        {
                            transform:
                                `translateY(110vh) rotate(${
                                    Math.random() * 720
                                }deg)`,

                            opacity: 0
                        }
                    ],

                    {
                        duration: duracao,
                        easing: "ease-in",
                        fill: "forwards"
                    }

                );


                setTimeout(
                    () => coracao.remove(),
                    duracao
                );

            }

        }

    </script>

</body>
</html>
