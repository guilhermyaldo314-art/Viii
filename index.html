<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma perguntinha ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(145deg, #ffdce8, #f7c7d8, #ead7ff);
            overflow: hidden;
            color: #4a2635;
        }

        .coracao {
            position: fixed;
            font-size: 22px;
            opacity: 0.35;
            animation: flutuar 6s linear infinite;
            pointer-events: none;
        }

        .c1 { left: 10%; animation-delay: 0s; }
        .c2 { left: 25%; animation-delay: 2s; }
        .c3 { left: 70%; animation-delay: 1s; }
        .c4 { left: 88%; animation-delay: 3s; }

        @keyframes flutuar {
            0% {
                transform: translateY(110vh) rotate(0deg);
            }

            100% {
                transform: translateY(-20vh) rotate(360deg);
            }
        }

        .card {
            width: 100%;
            max-width: 390px;
            background: rgba(255, 255, 255, 0.88);
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(100, 50, 80, 0.18);
            backdrop-filter: blur(10px);
            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
            animation: bater 1.5s infinite;
        }

        @keyframes bater {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        h1 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .pergunta {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.95);
        }

        .sim {
            background: #ff6f9c;
            color: white;
        }

        .talvez {
            background: #eadbff;
            color: #68427d;
        }

        .nao {
            background: #f1eeee;
            color: #6b5c61;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #resposta {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            background: #fff0f5;
            font-size: 17px;
            line-height: 1.5;
            animation: aparecer 0.5s ease;
        }

        .voltar {
            margin-top: 15px;
            background: transparent;
            color: #9b6478;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="coracao c1">❤️</div>
    <div class="coracao c2">💗</div>
    <div class="coracao c3">💕</div>
    <div class="coracao c4">💖</div>

    <main class="card">

        <div class="emoji">🥹❤️</div>

        <h1>Uma perguntinha hipotética...</h1>

        <p class="pergunta">
            Se eu estivesse aí agora, bem do seu ladinho,
            e te pedisse em namoro...
            <br><br>
            o que você me responderia? 👀
        </p>

        <div class="botoes" id="botoes">

            <button class="sim" onclick="responder('sim')">
                Sim ❤️
            </button>

            <button class="talvez" onclick="responder('talvez')">
                Talvez... 👀
            </button>

            <button class="nao" onclick="responder('nao')">
                Não 😭
            </button>

        </div>

        <div id="resposta"></div>

        <button class="voltar" id="voltar" onclick="voltar()">
            ← Quero escolher de novo
        </button>

    </main>

    <script>

        function responder(opcao) {

            const resposta = document.getElementById("resposta");
            const botoes = document.getElementById("botoes");
            const voltar = document.getElementById("voltar");

            botoes.style.display = "none";
            resposta.style.display = "block";
            voltar.style.display = "inline-block";

            if (opcao === "sim") {

                resposta.innerHTML = `
                    <strong>EU SABIAAA 😭❤️</strong>
                    <br><br>
                    Então vem cá, minha xuxuzinha 🥹💕
                `;

                confetes();

            } else if (opcao === "talvez") {

                resposta.innerHTML = `
                    <strong>Hmmm... 👀</strong>
                    <br><br>
                    Então eu ainda tenho uma chance? 🥹❤️
                `;

            } else {

                resposta.innerHTML = `
                    <strong>Tá bom... 😭</strong>
                    <br><br>
                    Eu aceito... mas essa resposta
                    doeu um pouquinho KKKKKK 🥲❤️
                `;
            }
        }

        function voltar() {

            document.getElementById("botoes").style.display = "flex";
            document.getElementById("resposta").style.display = "none";
            document.getElementById("voltar").style.display = "none";
        }

        function confetes() {

            for (let i = 0; i < 25; i++) {

                const coracao = document.createElement("div");

                coracao.innerHTML = ["❤️", "💕", "💖", "💗"][Math.floor(Math.random() * 4)];

                coracao.style.position = "fixed";
                coracao.style.left = Math.random() * 100 + "vw";
                coracao.style.top = "-30px";
                coracao.style.fontSize = (15 + Math.random() * 20) + "px";
                coracao.style.zIndex = "9999";
                coracao.style.pointerEvents = "none";

                document.body.appendChild(coracao);

                const duracao = 2000 + Math.random() * 2000;

                coracao.animate(
                    [
                        {
                            transform: "translateY(0) rotate(0deg)",
                            opacity: 1
                        },
                        {
                            transform: `translateY(110vh) rotate(${Math.random() * 720}deg)`,
                            opacity: 0
                        }
                    ],
                    {
                        duration: duracao,
                        easing: "ease-in",
                        fill: "forwards"
                    }
                );

                setTimeout(() => {
                    coracao.remove();
                }, duracao);
            }
        }

    </script>

</body>
</html>
